name: Basic AAC Demo
description: word mode asking for a drink
scene: "<default>"   # activate the built-in default scene first, so this demo works regardless of active scene
mode: word
audio: on
tileWait: .human
sentenceWait: .human

script:
  - comment: Basic AAC interaction flow
  - wait: 1s
  - tiles:
    - <home>, <people>, dad, <home>, <groups>, <feelings>, hungry, <home>, <food>, popsicle, <home> +

  - wait: 2s
  - comment: Demo complete
