name: Basic AAC Demo
description: sentence mode asking for a drink
scene: "<default>"   # activate the built-in default scene first, so this demo works regardless of active scene
mode: sentence
audio: on
tileWait: .human
sentenceWait: .human

script:
  - comment: Basic AAC interaction flow
  - wait: 1s
  - tiles:
    - <home>, <people>, dad, <feelings>, hungry, <food_snacks>, popsicle, <home>

  - wait: 2s
  
  - tiles:
    - <home>, i, <i_page>, love, <people>, grandpa, <home>

  - wait: 2s
  
  - comment: Demo complete
