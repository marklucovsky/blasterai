name: Tiles Showcase
description: tile showcase
scene: "<default>"
mode: word

audio: on
tileWait: .human
sentenceWait: .human

script:
  - wait: 1s
  - tileSet: classic_light
  - tiles:
    - <home>, <people>, mom, <home>, <food>, popsicle, cookie, <home> +
  - wait: 2s
  - screenshot: 01-classic_light
  - tileSet: classic_medium
  - wait: 2s
  - screenshot: 02-classic_medium
  - tileSet: classic_dark
  - wait: 2s
  - screenshot: 03-classic_dark
  - tileSet: hc
  - wait: 2s
  - screenshot: 04-high_contrast
  - tileSet: playful
  - wait: 2s
  - screenshot: 05-playful

  - comment: Your tile set is restored when the demo ends
