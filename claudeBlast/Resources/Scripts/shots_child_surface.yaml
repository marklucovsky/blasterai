name: Screenshots — Child Surface
description: Drives the board through the states worth photographing and captures each one.
scene: "Core-First"
audio: off
provider: mock
tileWait: .fast
sentenceWait: .fast

# Captures land in Documents/Screenshots/ inside the app container.
# On a simulator, read them straight off disk:
#
#   xcrun simctl get_app_container booted app.blasterai.ios data
#
# On a device, Files → On My iPad → Blaster → Screenshots.
#
# Names repeat safely: a second run writes home-board-2.png rather than
# overwriting the evidence from the first.

script:
  - comment: Empty board — the resting state a caregiver first sees
  - screenshot: 01-home-empty

  - comment: One tile selected, single-word affordance showing
  - tiles:
    - mom
  - screenshot: 02-one-tile

  - clear

  - comment: A full sentence in the tray
  - tiles:
    - mom, <food>, pizza
  - screenshot: 03-sentence-ready

  - clear

  - comment: A category page — Home is still cell 0 here
  - tiles:
    - <food>
  - screenshot: 04-category-page

  - comment: Deeper page, to show Home holds position past page 1
  - tiles:
    - <describe>
  - screenshot: 05-describe-page

  - comment: Screenshot run complete
